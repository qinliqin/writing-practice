<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日写作</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="site-header">
    <h1>每日写作</h1>
    <p class="tagline">写今天的事，写清楚，300–500 字。</p>
    <button type="button" class="settings-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel">
      设置
    </button>
  </header>

  <div class="settings-panel" id="settingsPanel" hidden>
    <p class="settings-status" id="settingsStatus">正在检查状态……</p>

    <label for="apiKeyInput">DeepSeek API Key（密钥 /ˈkiː/）</label>
    <div class="settings-row">
      <input
        type="password"
        id="apiKeyInput"
        autocomplete="off"
        placeholder="在这里粘贴密钥"
      />
      <button type="button" class="secondary-btn" id="saveApiKeyBtn">保存</button>
      <button type="button" class="back-link" id="clearApiKeyBtn">清除已保存的密钥</button>
    </div>

    <p class="settings-note">
      密钥只存在您浏览器的本地存储里，不会写到任何文件，也不会发给除 DeepSeek 之外的任何地方。
      没有密钥时无法批改，只能保存写作记录。
    </p>
  </div>

  <main>
    <section class="practice-screen" id="practiceScreen">
      <div class="progress-row">
        <span class="chip chip-timer" id="timerChip">用时：0:00</span>
        <span class="chip chip-words" id="wordCountChip">字数：0</span>
      </div>

      <div class="anchors-block" id="anchorsBlock">
        <p class="anchors-label">写之前，先定两个锚：</p>
        <input type="text" class="anchor-input" id="claimInput" placeholder="主张：我要说的那一句是什么？" />
        <input type="text" class="anchor-input" id="audienceInput" placeholder="对象：对谁说？" />
      </div>

      <form id="writingForm">
        <textarea
          id="writingInput"
          rows="14"
          placeholder="写今天的事，300–500 字。"
        ></textarea>

        <div class="form-footer">
          <span class="char-counter" id="charCounter">0 字</span>
          <button type="submit" class="check-btn" id="submitBtn" disabled>提交批改</button>
        </div>

        <p class="form-error" id="formError" role="alert" hidden></p>
      </form>
    </section>

    <section class="results-screen" id="resultsScreen" hidden>
      <h2 id="results-heading" tabindex="-1">批改结果</h2>

      <div class="review-card" id="reviewCard"></div>

      <div class="results-actions">
        <button type="button" class="primary-btn" id="anotherSetBtn">再写一篇</button>
      </div>
    </section>
  </main>

  <footer>
    <p>每天写，每天只改一处。</p>
  </footer>

  <script src="js/text-utils.js"></script>
  <script src="js/draft.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
